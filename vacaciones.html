<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacaciones · PDC Analytics Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#00216f;--navy2:#003090;--navy-dark:#001440;--sky:#7dbfe6;--sky2:#e8f6ff;
  --white:#FFFFFF;--bg:#F0F4F8;--card:#FFFFFF;--text:#0F1729;--text2:#5A6480;--border:#E2E8F0;--silver:#DBDBDB;
  --green:#DCF0C6;--green2:#2D9E2D;--yellow:#FFF4CC;--yellow2:#C48A00;--red:#FFBDBD;--red2:#CC0000;
  --radius:12px;--shadow:0 2px 16px rgba(0,32,96,.07);--shadow-md:0 6px 28px rgba(0,32,96,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
.skip-link{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--navy);color:#fff;padding:6px 12px;border-radius:6px}
.skip-link:focus{left:16px}
/* Header */
.hdr{background:linear-gradient(135deg,#001848 0%,var(--navy2) 100%);position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.25)}
.hdr-in{max-width:1320px;margin:0 auto;padding:0 24px;min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-pill{background:#fff;border-radius:8px;padding:5px 14px;display:flex;align-items:center}
.logo-pill img{height:28px;width:auto;display:block}
.hdr-title{font-family:'Poppins',system-ui,sans-serif;font-size:1rem;font-weight:800;color:var(--sky);letter-spacing:.04em;line-height:1.2}
.hdr-sub{font-size:.66rem;color:rgba(207,238,252,.65)}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hbtn{background:none;border:1px solid rgba(207,238,252,.35);color:var(--sky);border-radius:6px;padding:6px 12px;font-size:.72rem;font-weight:700;cursor:pointer}
.hbtn:hover{background:rgba(207,238,252,.12)}
.hbadge{background:rgba(207,238,252,.1);border:1px solid rgba(207,238,252,.18);border-radius:6px;padding:5px 11px;font-size:.7rem;font-weight:600;color:rgba(207,238,252,.85);display:inline-flex;align-items:center}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 60px}
/* Banner semáforo */
.banner{border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start;border-left:5px solid var(--green2);background:var(--green);color:#1f5a1f;font-weight:600}
.banner.r{border-left-color:var(--red2);background:var(--red);color:#7a0a0a}
.banner .bi{font-size:1.3rem;line-height:1.2}
.banner .bt{flex:1}
.banner small{display:block;font-weight:500;margin-top:2px}
.banner .links{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.banner .lk{background:#fff;border:1px solid var(--red2);color:var(--red2);border-radius:20px;padding:2px 10px;font-size:.74rem;font-weight:700;cursor:pointer}
.banner .rs{background:#fff;border:1px solid var(--silver);color:var(--navy);border-radius:6px;padding:5px 10px;font-size:.74rem;font-weight:700;cursor:pointer;margin-left:auto}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:14px 18px;box-shadow:var(--shadow)}
.kpi.y{background:var(--yellow);border-left:4px solid var(--yellow2)}
.kpi.g{background:var(--green);border-left:4px solid var(--green2)}
.kpi.r{background:var(--red);border-left:4px solid var(--red2)}
.kpi.n{border-left:4px solid var(--sky)}
.kpi-lbl{font-size:.72rem;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.kpi-val{font-size:1.6rem;font-weight:800;color:var(--navy);line-height:1.2;margin-top:2px}
.kpi-sub{font-size:.76rem;color:var(--text2)}
/* Personas */
.sec-t{font-family:'Poppins',system-ui,sans-serif;font-size:.8rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 10px;display:flex;align-items:center;gap:10px}
.sec-t small{font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;color:var(--text2);font-weight:500;font-size:.76rem}
.pers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.pc{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;text-align:left;width:100%;transition:box-shadow .15s,border-color .15s}
.pc:hover{box-shadow:var(--shadow-md)}
.pc.on{border-color:var(--navy);box-shadow:var(--shadow-md);background:var(--sky2)}
.pc-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--pc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Poppins',sans-serif}
.av.dk{color:var(--navy)}
.pc-n{font-weight:700;color:var(--navy);line-height:1.2}
.pc-h{font-size:.74rem;color:var(--text2)}
.pc-d{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.pc-d b{font-size:1.7rem;font-weight:800;color:var(--navy);line-height:1}
.pc-d span{font-size:.76rem;color:var(--text2)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{background:var(--sky);color:var(--navy);border-radius:20px;padding:1px 9px;font-size:.7rem;font-weight:700}
.tag.none{background:var(--bg);color:var(--text2);font-weight:500}
/* Panel */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.toolbar{display:flex;gap:14px 24px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ntabs{display:flex;gap:4px;flex-wrap:wrap}
.ntab{padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--text2);border:none;background:none}
.ntab:hover{background:var(--sky);color:var(--navy)}
.ntab.on{background:var(--navy);color:var(--white);font-weight:600}
.legend{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.filtro{font-size:.78rem;color:var(--text2)}
.filtro button{background:var(--sky);border:none;color:var(--navy);font-weight:700;border-radius:20px;padding:2px 10px;margin-left:6px;cursor:pointer;font-size:.72rem}
/* Calendario */
.mes{margin-bottom:20px}
.mes h3{font-family:'Poppins',sans-serif;font-size:1rem;font-weight:700;color:var(--navy);text-transform:capitalize;margin-bottom:8px}
.cal-head,.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head div{font-size:.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;text-align:center;padding:2px 0}
.cal-row{margin-bottom:6px}
.cell{background:var(--bg);border:1px solid var(--border);border-radius:10px;min-height:96px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;transition:box-shadow .15s}
.cell:hover{box-shadow:var(--shadow-md)}
.cell.empty{background:transparent;border:none;cursor:default;box-shadow:none}
.cell.out{opacity:.4;cursor:default;box-shadow:none}
.cell.dom{background:#E7ECF2}
.cell.fer{background:var(--yellow);border-color:var(--yellow2)}
.cell.hoy{outline:2px solid var(--navy);outline-offset:1px}
.cell.gap{border-color:var(--red2);background:#FFF1F1}
.cell.mio{box-shadow:inset 0 0 0 2px var(--navy)}
.cell .top{display:flex;justify-content:space-between;align-items:center}
.cell .dn{font-weight:800;color:var(--navy);font-size:.9rem}
.cell .fn{font-size:.62rem;color:var(--yellow2);font-weight:700}
.esp{font-size:.6rem;background:var(--navy);color:#fff;border-radius:20px;padding:0 7px;font-weight:700}
.chip{font-size:.68rem;border-radius:6px;padding:2px 6px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--sky);color:var(--navy)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 1.5px #fff}
.pie{margin-top:auto;display:flex;align-items:center;gap:5px;font-size:.66rem;color:var(--text2);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green2);flex:none}
.dot.r{background:var(--red2)}
.dot.n{background:var(--silver)}
/* Tabla */
.scroll{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:0;font-size:.78rem;min-width:100%}
.mx th,.mx td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;padding:0}
.mx thead th{background:var(--navy);color:#fff;font-weight:600;padding:5px 2px;min-width:34px}
.mx thead th small{display:block;font-size:.58rem;font-weight:500;opacity:.75}
.mx thead th.mh{background:var(--navy2);text-transform:capitalize;padding:6px}
.mx thead th.dom{background:#3a4a7a}
.mx .nom{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:7px 10px;min-width:180px;border-right:2px solid var(--navy)}
.mx thead .nom{background:var(--navy);z-index:3}
.mx .nom b{display:block;color:var(--navy)}
.mx .nom span{font-size:.68rem;color:var(--text2);font-weight:400}
.mx td.c{height:36px;cursor:pointer;font-weight:800}
.mx td.c:hover{filter:brightness(.94)}
.mx td.N{background:#F7FAFC;color:var(--silver)}
.mx td.L{background:var(--green);color:var(--green2)}
.mx td.V{background:var(--sky);color:var(--navy)}
.mx td.D{background:#E7ECF2;color:var(--text2)}
.mx td.F{background:var(--yellow);color:var(--yellow2)}
.mx td.es{box-shadow:inset 0 0 0 2px var(--navy)}
.mx tfoot th,.mx tfoot td{background:#DCE8FE;color:var(--navy);font-weight:700;padding:6px 2px}
.mx tfoot td.bad{background:var(--red2);color:#fff}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,23,41,.55);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 12px 48px rgba(0,32,96,.3)}
.mh{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:16px 16px 0 0;position:sticky;top:0}
.mh h3{font-family:'Poppins',sans-serif;font-size:1rem;font-weight:700}
.mh button{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1}
.mb{padding:16px 18px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge.g{background:var(--green);color:var(--green2)}
.badge.r{background:var(--red);color:var(--red2)}
.badge.n{background:var(--sky);color:var(--navy)}
.grp{margin-top:14px}
.grp h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin-bottom:6px}
.who{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.who .av{width:30px;height:30px;font-size:.78rem}
.who .wn{font-weight:600;color:var(--navy);flex:1;line-height:1.25}
.who .wn small{display:block;font-weight:400;color:var(--text2);font-size:.72rem}
.who select{padding:6px 8px;border:1.5px solid var(--silver);border-radius:8px;background:#fff;font-weight:600}
.vacio{color:var(--text2);font-size:.82rem;padding:4px 0}
.tl{display:grid;grid-template-columns:repeat(36,1fr);height:20px;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.tl .s0{background:var(--red2)}.tl .s1{background:var(--yellow2)}.tl .s2{background:var(--green2)}.tl .s3{background:var(--green2);opacity:.75}.tl .sx{background:var(--silver)}
.tl-l{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text2)}
.nota{background:var(--yellow);border-radius:8px;padding:8px 12px;font-size:.78rem;color:#7a5800;margin-top:12px}
.btn{font-family:inherit;font-size:.78rem;font-weight:700;padding:8px 16px;border:none;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.sec{background:var(--bg);color:var(--navy);border:1px solid var(--silver)}
.mf{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}
.foot{font-size:.72rem;color:var(--text2);text-align:center;margin-top:16px}
@media(max-width:1000px){.pers{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:1fr}}
@media(max-width:600px){.pers{grid-template-columns:1fr}.cell{min-height:74px}.chip{font-size:.58rem}.wrap{padding:12px}.legend{margin-left:0}}
@media print{.hdr-actions,.toolbar,.ov,.banner .rs{display:none!important}body{background:#fff}.panel,.kpi,.pc{box-shadow:none;break-inside:avoid}.hdr{position:static}}

/* ===== Vacaciones multipaís: barra de trimestre, análisis, formularios ===== */
.qbar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 16px;margin-bottom:16px}
.fl{font-size:.74rem;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:6px}
.qbar select,.frm select,.frm input,.frm textarea,.erow select,.erow input,textarea.mono{font-family:inherit;font-size:.82rem;padding:6px 8px;border:1.5px solid var(--silver);border-radius:8px;background:#fff;color:var(--text)}
.qnav{display:flex;gap:4px;align-items:center}
.qnav select{font-weight:700;color:var(--navy);min-width:110px}
.qb{background:var(--sky2);border:1px solid var(--sky);color:var(--navy);border-radius:8px;padding:6px 11px;font-weight:700;cursor:pointer;font-size:.8rem}
.qb:hover{background:var(--sky)}
.qb.t{background:var(--navy);color:#fff;border-color:var(--navy)}
.qinfo{font-size:.72rem;color:var(--text2);flex:1;min-width:180px}
.qadm{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.aviso{background:var(--yellow);border-left:4px solid var(--yellow2);color:#7a5800;border-radius:8px;padding:8px 12px;font-size:.78rem;margin:-6px 0 14px}
.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.gc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.gc h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin-bottom:8px;font-family:'Poppins',sans-serif}
.gh{position:relative;height:260px}
table.hx{min-width:0;width:100%}
.hx th,.hx td{padding:7px 10px;text-align:center}
.hx thead th{background:var(--navy);color:#fff;font-weight:600;font-size:.74rem}
.hx tbody tr[data-action]{cursor:pointer}
.hx tbody tr[data-action]:hover td,.hx tbody tr[data-action]:hover th{background:var(--sky2)}
.hx tr.sel td,.hx tr.sel th{background:var(--sky2)}
.hx td.bad{background:var(--red);color:var(--red2);font-weight:700}
.hx .nom{text-align:left;min-width:120px}
.bt td{font-size:.74rem;text-align:left}
.lk2{background:var(--bg);border:1px solid var(--silver);color:var(--navy);border-radius:6px;padding:2px 9px;font-size:.7rem;font-weight:700;cursor:pointer}
.lk2:hover{background:var(--sky)}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.frm label,.erow label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;font-weight:600;color:var(--text2)}
.frm label.w2{grid-column:1/-1}
.frm label.ck{flex-direction:row;align-items:center;gap:8px}
.frm .par{display:flex;gap:6px;align-items:center;font-weight:500}
.frm textarea{width:100%;resize:vertical}
textarea.mono{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
.hint{font-size:.74rem;color:var(--text2);margin:6px 0}
.hint code{background:var(--bg);padding:1px 5px;border-radius:4px}
.erow{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(120px,1fr) minmax(110px,.9fr) minmax(270px,1.9fr);gap:8px 10px;align-items:end;padding:8px 0;border-bottom:1px solid var(--border)}
.erow .par{display:flex;gap:6px;align-items:center;font-weight:500}
.erow .hid{visibility:hidden}
.erow input[type=time]{min-width:0;width:100%}
.prow{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:var(--bg)}
.prow table{background:#fff}
.hadd{margin-top:8px;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:500;max-width:90vw;box-shadow:var(--shadow-md)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red2)}
.modal{max-width:760px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.gr{grid-template-columns:1fr}}
@media(max-width:700px){.kpis{grid-template-columns:1fr}.frm{grid-template-columns:1fr}.erow{grid-template-columns:1fr}.hadd{grid-template-columns:1fr}}
@media print{.qbar,.toast{display:none!important}}
</style>
<style>html:not([data-auth="ok"]) body{display:none}</style>
<script>
/* Auth Bridge v2.0 — Vacaciones multipaís. Sin sesión válida -> login; sin permiso -> portal.
   Acceso: dashboard 'vacaciones' asignado al perfil Y (rol admin, o supervisor/consulta de GT/ESV/PE/regional).
   Edición: solo rol admin (la base de datos lo exige además con RLS: este chequeo es solo de interfaz). */
(function(){
  var s=null;
  try{var raw=sessionStorage.getItem('pdc_session');if(raw){s=JSON.parse(raw);if(!s||Date.now()-s.ts>8*60*60*1000)s=null;}}catch(e){s=null;}
  if(!s){window.location.replace('login.html');return;}
  var dash=Array.isArray(s.dashboards)?s.dashboards:[];
  var rol=String(s.rol||'').toLowerCase(),pais=String(s.pais||'').toUpperCase();
  var todos=['GT','ESV','PE'];
  var ok=dash.indexOf('vacaciones')>-1&&(rol==='admin'||((rol==='supervisor'||rol==='consulta')&&(pais==='REGIONAL'||todos.indexOf(pais)>-1)));
  if(!ok){window.location.replace('analytics.html');return;}
  var verTodos=(rol==='admin'||pais==='REGIONAL');
  window.PDC_VAC={nombre:String(s.nombre||''),email:String(s.email||''),rol:rol,pais:pais,editar:rol==='admin',paises:verTodos?todos:[pais]};
  document.documentElement.setAttribute('data-auth','ok');
})();
</script>
</head>
<body>

<script>
(function(){
'use strict';
var S=window.PDC_VAC;
if(!S){return;}
var EDIT=!!S.editar;
var SB_URL='https://pytsrgtcjytjztwdlvux.supabase.co';
var SB_KEY='sb_publishable_mW5PeN4eRbl56zLlTP-vVg_NzCJTTfj';
var PAISES={GT:{n:'Guatemala',f:'🇬🇹'},ESV:{n:'El Salvador',f:'🇸🇻'},PE:{n:'Perú',f:'🇵🇪'}};
var ROL_LBL={admin:'Administrador',supervisor:'Supervisor',consulta:'Consulta'};
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DSEM=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var DS3=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var ESTADOS={N:'Turno regular',L:'Labora / cubre',V:'Vacaciones',D:'Descanso / libre',F:'Feriado'};
var PALETA=['#00216f','#5db9a3','#7dbfe6','#5A6480'];
var sb=null;

/* ============ UTILIDADES ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function pad(n){return (n<10?'0':'')+n;}
function parseISO(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function toISO(ms){var d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function dow(s){return new Date(parseISO(s)).getUTCDay();}
function fmt(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtC(s){return fmt(s).slice(0,5);}
function toMin(h){var p=String(h).split(':');return (+p[0])*60+(+p[1]);}
function endMin(f,i){var e=toMin(f);if(e<=toMin(i))e+=1440;return e;}
function hhmm(m){var h=Math.floor(m/60);return pad(h===24?0:h)+':'+pad(m%60);}
function fmtN(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function fmtH(min){return fmtN(min/60)+' h';}
function hoyISO(){var t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function colorOk(c){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:'#00216f';}
function inicial(p){return p.nombre.charAt(0);}
function persona(id){for(var i=0;i<M.P.length;i++){if(M.P[i].id===id)return M.P[i];}return null;}
function fechaLarga(iso){return new Date(iso).toLocaleString('es-GT',{timeZone:'America/Guatemala',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}
function toast(msg,err){var t=$('toast');t.textContent=msg;t.className='toast on'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast';},err?7000:3000);}
function msgErr(e){return (e&&e.message)?e.message:String(e);}

/* ---- trimestres ---- */
function qDe(d){return {y:+d.slice(0,4),q:Math.floor((+d.slice(5,7)-1)/3)+1};}
function qKey(q){return q.y*4+(q.q-1);}
function qDeKey(k){return {y:Math.floor(k/4),q:(k%4)+1};}
function qLbl(q){return 'Q'+q.q+' '+q.y;}
function qMeses(q){var a=(q.q-1)*3;return [a,a+1,a+2];}
function qDias(q){var ms=qMeses(q),ini=Date.UTC(q.y,ms[0],1),fin=Date.UTC(q.y,ms[2]+1,0),o=[],t;for(t=ini;t<=fin;t+=86400000)o.push(toISO(t));return o;}

/* ============ MODELO (datos desde Supabase) ============ */
var M={pais:null,cfg:null,P:[],HOR:{},DIA:{},FER:{},VEN:{},NOT:{},ESP:{},vRows:[],minF:null,maxF:null,ok:false,sinSesion:false,error:null};
var UI={vista:'cal',mes:'all',pers:'all',q:qDe(hoyISO()),modal:null,editar:false,bit:null,bitCargando:false};
var CH={};

function horBase(p,d){var hs=M.HOR[p.id]||[],best=null,i,h;for(i=0;i<hs.length;i++){h=hs[i];if(h.desde<=d&&(!h.hasta||h.hasta>=d)&&(!best||h.desde>best.desde))best=h;}return best;}
function horario(p,d){
  var r=M.DIA[p.id+'|'+d],hb=horBase(p,d);
  if(r&&r.ini&&r.fin&&r.tipo!=='V')return {ini:r.ini,fin:r.fin,esp:true,turno:hb?hb.turno:null};
  if(hb)return {ini:hb.ini,fin:hb.fin,esp:false,turno:hb.turno};
  return null;
}
function basePat(p,d){
  var w=dow(d);
  if(w===0)return 'D';
  if(M.FER[d])return 'F';
  if(w===6){
    if(p.sab==='no')return 'D';
    if(p.sab==='alterno'&&p.sab_ancla){var k=Math.round((parseISO(d)-parseISO(p.sab_ancla))/604800000);if(((k%2)+2)%2!==0)return 'D';}
  }
  return 'N';
}
function status(d,p){var r=M.DIA[p.id+'|'+d];return r?r.tipo:basePat(p,d);}
function vacW(p,d){var r=M.DIA[p.id+'|'+d];return (r&&r.tipo==='V')?Number(r.valor):1;}
function intervalo(p,d){
  var st=status(d,p),r=M.DIA[p.id+'|'+d];
  if(st==='V'){if(r&&Number(r.valor)===0.5&&r.ini&&r.fin)return [toMin(r.ini),endMin(r.fin,r.ini)];return null;}
  if(st==='N'||st==='L'){var h=horario(p,d);if(!h)return null;return [toMin(h.ini),endMin(h.fin,h.ini)];}
  return null;
}
function ventana(d){
  var v=M.VEN[d];
  if(v)return [v.desde_min,v.hasta_min];
  if(M.cfg.sab_auto&&dow(d)===6){
    var a=1e9,b=-1;
    M.P.forEach(function(p){if(basePat(p,d)==='N'){var h=horBase(p,d);if(h){a=Math.min(a,toMin(h.ini));b=Math.max(b,endMin(h.fin,h.ini));}}});
    if(b>0)return [a,b];
  }
  return [M.cfg.oper_ini,M.cfg.oper_fin];
}
function grid(){return {ini:Math.min(360,Math.floor(M.cfg.oper_ini/30)*30),fin:1440};}
function operativo(d){
  if(dow(d)!==0&&!M.FER[d])return true;
  return M.P.some(function(p){return intervalo(p,d)!==null;});
}
function cobertura(d){
  var g=grid(),conteo=[],s,i,iv,w=ventana(d);
  for(s=g.ini;s<g.fin;s+=30){
    var c=0;
    for(i=0;i<M.P.length;i++){iv=intervalo(M.P[i],d);if(iv&&iv[0]<s+30&&iv[1]>s)c++;}
    conteo.push(c);
  }
  var gaps=[],ini=null,total=0;
  if(operativo(d)){
    conteo.forEach(function(c,k){
      var m=g.ini+k*30,z=(c===0&&m>=w[0]&&m<w[1]);
      if(z){if(ini===null)ini=m;}
      else if(ini!==null){gaps.push({a:ini,b:m});total+=m-ini;ini=null;}
    });
    if(ini!==null){gaps.push({a:ini,b:w[1]});total+=w[1]-ini;}
  }
  return {conteo:conteo,gaps:gaps,min:total,win:w,g:g};
}
function trabajando(d){var n=0;M.P.forEach(function(p){if(intervalo(p,d))n++;});return n;}

function stats(q){
  var ds=qDias(q),r={por:{},total:0,conVac:0,gapDias:[],gapMin:0,ds:ds};
  M.P.forEach(function(p){r.por[p.id]={v:0,fechas:[]};});
  ds.forEach(function(d){
    M.P.forEach(function(p){if(status(d,p)==='V'){var w=vacW(p,d);r.por[p.id].v+=w;r.por[p.id].fechas.push(d);r.total+=w;}});
    var c=cobertura(d);if(c.min>0){r.gapDias.push({d:d,min:c.min});r.gapMin+=c.min;}
  });
  M.P.forEach(function(p){if(r.por[p.id].v>0)r.conVac++;});
  return r;
}
function proxima(){
  var hoy=hoyISO(),best=null;
  M.vRows.forEach(function(r){if(r.fecha>=hoy&&(!best||r.fecha<best))best=r.fecha;});
  if(!best)return null;
  var quien=[];M.P.forEach(function(p){if(status(best,p)==='V')quien.push(p.corto);});
  return quien.length?{d:best,quien:quien}:null;
}

/* ============ CARGA ============ */
async function fetchAll(tabla,filtro,orden){
  var out=[],from=0,paso=1000,q,r;
  for(;;){
    q=sb.from(tabla).select('*');
    if(filtro)q=filtro(q);
    q=q.order(orden).order('id').range(from,from+paso-1);
    r=await q;
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<paso)break;
    from+=paso;
  }
  return out;
}
async function cargar(pais,silencioso){
  M.error=null;M.sinSesion=false;
  try{
    var ses=await sb.auth.getSession();
    if(!ses||!ses.data||!ses.data.session){M.sinSesion=true;M.ok=false;return false;}
    var r=await Promise.all([
      sb.from('vac_paises').select('*').eq('pais',pais).maybeSingle(),
      sb.from('vac_personas').select('*').eq('pais',pais).eq('activo',true).order('orden').order('nombre'),
      sb.from('vac_reglas').select('*').eq('pais',pais).order('fecha')
    ]);
    r.forEach(function(x){if(x.error)throw x.error;});
    if(!r[0].data)throw new Error('No hay configuración cargada para este país, o no tiene permiso para verla.');
    var P=r[1].data||[],ids=P.map(function(p){return p.id;}),hs=[],ds=[];
    if(ids.length){
      var f=function(q){return q.in('persona_id',ids);};
      var rr=await Promise.all([fetchAll('vac_horarios',f,'desde'),fetchAll('vac_dias',f,'fecha')]);
      hs=rr[0];ds=rr[1];
    }
    M.pais=pais;M.cfg=r[0].data;
    M.P=P.map(function(p){p.color=colorOk(p.color);return p;});
    M.HOR={};hs.forEach(function(h){(M.HOR[h.persona_id]=M.HOR[h.persona_id]||[]).push(h);});
    M.DIA={};M.vRows=[];M.ESP={};M.minF=null;M.maxF=null;
    ds.forEach(function(x){
      M.DIA[x.persona_id+'|'+x.fecha]=x;
      if(x.tipo==='V')M.vRows.push(x);
      if(x.tipo==='L'&&x.ini)M.ESP[x.fecha]=1;
      if(!M.minF||x.fecha<M.minF)M.minF=x.fecha;
      if(!M.maxF||x.fecha>M.maxF)M.maxF=x.fecha;
    });
    M.FER={};M.VEN={};M.NOT={};
    (r[2].data||[]).forEach(function(x){
      if(x.tipo==='feriado')M.FER[x.fecha]=x.texto||'Feriado';
      else if(x.tipo==='ventana'&&x.desde_min!=null&&x.hasta_min!=null){M.VEN[x.fecha]={desde_min:x.desde_min,hasta_min:x.hasta_min};M.ESP[x.fecha]=1;}
      else if(x.tipo==='nota')M.NOT[x.fecha]=x.texto||'';
      if(!M.minF||x.fecha<M.minF)M.minF=x.fecha;
      if(!M.maxF||x.fecha>M.maxF)M.maxF=x.fecha;
    });
    if(UI.pers!=='all'&&!persona(UI.pers))UI.pers='all';
    M.ok=true;return true;
  }catch(e){
    M.ok=false;M.error=msgErr(e);
    if(!silencioso)toast('No se pudieron cargar los datos: '+M.error,true);
    return false;
  }
}

function exigirAdmin(){if(!EDIT)throw new Error('Solo un administrador puede modificar la programación.');}

function parDeHoras(i,f){if((i&&!f)||(!i&&f))throw new Error('Complete la hora de inicio y la de fin.');return i?[i,f]:null;}
async function chk(p){var r=await p;if(r&&r.error)throw r.error;return r;}

async function guardarDia(){
  exigirAdmin();
  var d=UI.modal.d,rows=[],dels=[],er=document.querySelectorAll('#modal .erow'),i;
  for(i=0;i<er.length;i++){
    var el=er[i],p=persona(el.getAttribute('data-p')),est=el.querySelector('.e-est').value,vv=el.querySelector('.e-val').value;
    var hh=parDeHoras(el.querySelector('.e-ini').value,el.querySelector('.e-fin').value),base=basePat(p,d),cur=M.DIA[p.id+'|'+d],tipo=null;
    if(est==='V'){tipo='V';}
    else if(est==='N'||est==='L'){if(base==='N'){if(hh)tipo='L';}else tipo='L';}
    else if(est==='D'){if(base==='N')tipo='D';}
    if(tipo){
      var half=(tipo==='V'&&vv==='0.5');
      rows.push({persona_id:p.id,fecha:d,tipo:tipo,valor:half?0.5:1,ini:(tipo==='D'||(tipo==='V'&&!half))?null:(hh?hh[0]:null),fin:(tipo==='D'||(tipo==='V'&&!half))?null:(hh?hh[1]:null),actualizado:new Date().toISOString()});
    }else if(cur)dels.push(p.id);
  }
  if(rows.length)await chk(sb.from('vac_dias').upsert(rows,{onConflict:'persona_id,fecha'}));
  if(dels.length)await chk(sb.from('vac_dias').delete().eq('fecha',d).in('persona_id',dels));
  var fer=val('e-fer'),vi=val('e-vi'),vf=val('e-vf'),nota=val('e-nota'),vp=parDeHoras(vi,vf);
  if(fer)await chk(sb.from('vac_reglas').upsert({pais:M.pais,fecha:d,tipo:'feriado',texto:fer},{onConflict:'pais,fecha,tipo'}));
  else if(M.FER[d])await chk(sb.from('vac_reglas').delete().eq('pais',M.pais).eq('fecha',d).eq('tipo','feriado'));
  if(vp){
    var a=toMin(vp[0]),b=endMin(vp[1],vp[0]);if(b>1440)b=1440;
    await chk(sb.from('vac_reglas').upsert({pais:M.pais,fecha:d,tipo:'ventana',desde_min:a,hasta_min:b},{onConflict:'pais,fecha,tipo'}));
  }else if(M.VEN[d])await chk(sb.from('vac_reglas').delete().eq('pais',M.pais).eq('fecha',d).eq('tipo','ventana'));
  if(nota)await chk(sb.from('vac_reglas').upsert({pais:M.pais,fecha:d,tipo:'nota',texto:nota},{onConflict:'pais,fecha,tipo'}));
  else if(M.NOT[d]!==undefined)await chk(sb.from('vac_reglas').delete().eq('pais',M.pais).eq('fecha',d).eq('tipo','nota'));
  UI.editar=false;UI.bit=null;
  await recargar(true);
  toast('Cambios guardados.');
}

async function aplicarFilas(rows,dels){
  var k;
  for(k=0;k<rows.length;k+=400)await chk(sb.from('vac_dias').upsert(rows.slice(k,k+400),{onConflict:'persona_id,fecha'}));
  for(k=0;k<dels.length;k+=1)await chk(sb.from('vac_dias').delete().eq('persona_id',dels[k].pid).eq('fecha',dels[k].fecha));
}
async function bulkRango(){
  exigirAdmin();
  var pid=val('b-p'),t=val('b-t'),d1=val('b-d'),d2=val('b-h'),vv=val('b-v'),hh=parDeHoras(val('b-i'),val('b-f')),omit=$('b-o').checked;
  if(!d1||!d2||d2<d1)throw new Error('Revise el rango de fechas.');
  var n=Math.round((parseISO(d2)-parseISO(d1))/86400000)+1;
  if(n>400)throw new Error('El rango máximo es de 400 días por carga.');
  var p=persona(pid),rows=[],dels=[],ds=[],k;
  for(k=0;k<n;k++)ds.push(toISO(parseISO(d1)+k*86400000));
  ds.forEach(function(d){
    if(t==='Q'){if(M.DIA[pid+'|'+d])dels.push({pid:pid,fecha:d});return;}
    if(omit&&(dow(d)===0||M.FER[d]))return;
    if(t==='D'&&basePat(p,d)!=='N')return;
    rows.push(filaDia(pid,d,t,t==='V'?vv:1,t==='D'?null:(hh?hh[0]:null),t==='D'?null:(hh?hh[1]:null)));
  });
  if(!rows.length&&!dels.length)throw new Error('No hay días para cambiar con esa selección.');
  if(!window.confirm('Se aplicarán '+(rows.length||dels.length)+' día(s) a '+p.nombre+'. ¿Continuar?'))return;
  await aplicarFilas(rows,dels);
  UI.bit=null;await recargar(true);toast('Cargados '+(rows.length||dels.length)+' día(s).');
}
function normTxt(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function parseFecha(s){
  s=String(s||'').trim();var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?s:null;
}
async function bulkCsv(){
  exigirAdmin();
  var txt=val('b-csv'),lines=txt.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean),errs=[],rows=[],dels=[];
  if(!lines.length)throw new Error('Pegue al menos una línea.');
  lines.forEach(function(ln,i){
    var c=ln.split(/[;\t]/).map(function(x){return x.trim();});
    if(c.length<3){errs.push('Línea '+(i+1)+': faltan columnas.');return;}
    var f=parseFecha(c[0]),p=M.P.filter(function(x){return normTxt(x.corto)===normTxt(c[1])||normTxt(x.nombre)===normTxt(c[1])||normTxt(x.codigo)===normTxt(c[1]);})[0],t=String(c[2]).toUpperCase();
    if(!f||isNaN(parseISO(f))){errs.push('Línea '+(i+1)+': fecha inválida.');return;}
    if(!p){errs.push('Línea '+(i+1)+': colaborador «'+c[1]+'» no existe.');return;}
    if(['V','L','D','N','Q'].indexOf(t)<0){errs.push('Línea '+(i+1)+': tipo inválido (use V, L, D o Q).');return;}
    if(t==='N'||t==='Q'){dels.push({pid:p.id,fecha:f});return;}
    var v=(c[3]||'1').replace(',','.'),ini=c[4]||'',fin=c[5]||'';
    if(v!=='1'&&v!=='0.5'){errs.push('Línea '+(i+1)+': valor debe ser 1 o 0.5.');return;}
    if((ini&&!/^\d{1,2}:\d{2}$/.test(ini))||(fin&&!/^\d{1,2}:\d{2}$/.test(fin))||(!!ini!==!!fin)){errs.push('Línea '+(i+1)+': horario inválido.');return;}
    rows.push(filaDia(p.id,f,t,t==='V'?v:1,t==='D'?null:(ini?pad(+ini.split(':')[0])+':'+ini.split(':')[1]:null),t==='D'?null:(fin?pad(+fin.split(':')[0])+':'+fin.split(':')[1]:null)));
  });
  if(errs.length)throw new Error(errs.slice(0,5).join(' ')+(errs.length>5?' (+'+(errs.length-5)+' más)':''));
  if(!window.confirm('Se aplicarán '+lines.length+' línea(s). ¿Continuar?'))return;
  await aplicarFilas(rows,dels);
  UI.bit=null;await recargar(true);toast('Aplicadas '+lines.length+' línea(s).');
}
async function cfgSave(){
  exigirAdmin();
  var i=val('c-i'),f=val('c-f');if(!i||!f)throw new Error('Indique la ventana de atención.');
  var a=toMin(i),b=toMin(f);if(b>=1439)b=1440;if(b<=a)throw new Error('La hora final debe ser posterior a la inicial.');
  await chk(sb.from('vac_paises').update({oper_ini:a,oper_fin:b,sab_auto:$('c-s').checked,actualizado:new Date().toISOString()}).eq('pais',M.pais));
  UI.bit=null;await recargar(true);toast('Ventana guardada.');
}
function pEl(btn){return btn.closest('.prow');}
async function perSave(btn){
  exigirAdmin();var el=pEl(btn),pid=el.getAttribute('data-p');
  var n=el.querySelector('.p-n').value.trim(),k=el.querySelector('.p-k').value.trim(),s=el.querySelector('.p-s').value,a=el.querySelector('.p-a').value||null;
  if(!n||!k)throw new Error('Nombre y nombre corto son obligatorios.');
  if(s==='alterno'&&!a)throw new Error('Para sábados alternos indique un sábado en que sí labora.');
  if(a&&dow(a)!==6)throw new Error('La fecha de referencia debe ser sábado.');
  await chk(sb.from('vac_personas').update({nombre:n,corto:k,sab:s,sab_ancla:s==='alterno'?a:null,color:el.querySelector('.p-c').value}).eq('id',pid));
  UI.bit=null;await recargar(true);toast('Colaborador actualizado.');
}
async function perBaja(btn){
  exigirAdmin();var el=pEl(btn),p=persona(el.getAttribute('data-p'));
  if(!window.confirm('¿Dar de baja a '+p.nombre+'? Se conserva su historial pero deja de aparecer en el calendario.'))return;
  await chk(sb.from('vac_personas').update({activo:false}).eq('id',p.id));
  UI.bit=null;await recargar(true);toast('Colaborador dado de baja.');
}
async function horAdd(btn){
  exigirAdmin();var el=pEl(btn),pid=el.getAttribute('data-p'),t=+el.querySelector('.h-t').value,hh=parDeHoras(el.querySelector('.h-i').value,el.querySelector('.h-f').value),d=el.querySelector('.h-d').value,h2=el.querySelector('.h-h').value||null;
  if(!hh||!d||!t)throw new Error('Indique turno, horario y fecha de inicio.');
  if(h2&&h2<d)throw new Error('La fecha final no puede ser anterior a la inicial.');
  var ya=(M.HOR[pid]||[]).filter(function(x){return x.desde<=(h2||'9999-12-31')&&(!x.hasta||x.hasta>=d);});
  if(ya.length&&!window.confirm('Ya existe un horario vigente en esas fechas; se usará el que empiece más tarde. ¿Continuar?'))return;
  await chk(sb.from('vac_horarios').insert({persona_id:pid,desde:d,hasta:h2,turno:t,ini:hh[0],fin:hh[1]}));
  UI.bit=null;await recargar(true);toast('Horario agregado.');
}
async function horDel(btn){
  exigirAdmin();await chk(sb.from('vac_horarios').delete().eq('id',btn.getAttribute('data-h')));
  UI.bit=null;await recargar(true);toast('Horario quitado.');
}
async function perAdd(){
  exigirAdmin();var n=val('n-n'),k=val('n-k'),t=+val('n-t'),hh=parDeHoras(val('n-i'),val('n-f'));
  if(!n||!k||!hh)throw new Error('Complete nombre, nombre corto y horario.');
  var cod=normTxt(n).replace(/[^a-z0-9]+/g,'');if(!cod)throw new Error('Nombre inválido.');
  var r=await chk(sb.from('vac_personas').insert({pais:M.pais,codigo:cod,nombre:n,corto:k,color:PALETA[M.P.length%PALETA.length],orden:M.P.length+1}).select().single());
  await chk(sb.from('vac_horarios').insert({persona_id:r.data.id,desde:'2000-01-01',turno:t||1,ini:hh[0],fin:hh[1]}));
  UI.bit=null;await recargar(true);toast('Colaborador agregado.');
}
async function revertir(id){
  exigirAdmin();
  var b=(UI.bit||[]).filter(function(x){return String(x.id)===String(id);})[0];if(!b||b.tabla!=='vac_dias')return;
  if(!window.confirm('¿Revertir este cambio ('+(b.persona||'')+(b.fecha_ref?' · '+fmt(b.fecha_ref):'')+')?'))return;
  var a=b.antes,d=b.despues;
  if(b.accion==='INSERT')await chk(sb.from('vac_dias').delete().eq('id',d.id));
  else{var o={id:a.id,persona_id:a.persona_id,fecha:a.fecha,tipo:a.tipo,valor:a.valor,ini:a.ini,fin:a.fin,actualizado:new Date().toISOString()};await chk(sb.from('vac_dias').upsert(o,{onConflict:'persona_id,fecha'}));}
  UI.bit=null;await recargar(true);if(UI.vista==='his')cargarBit();toast('Cambio revertido.');
}

/* ============ EXPORTACIÓN ============ */
function descargar(nombre,tipo,txt){
  try{var b=new Blob([txt],{type:tipo}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}catch(e){}
}
function exportCSV(){
  var rows=['fecha;dia;turno;colaborador;horario;estado;dias_vacaciones'];
  qDias(UI.q).forEach(function(d){M.P.forEach(function(p){var st=status(d,p),z=horario(p,d);rows.push([fmt(d),DS3[dow(d)],z&&z.turno?z.turno:'',p.nombre,z?z.ini+'-'+z.fin:'',ESTADOS[st],st==='V'?vacW(p,d):0].join(';'));});});
  descargar('vacaciones_'+M.pais+'_'+UI.q.y+'_Q'+UI.q.q+'.csv','text/csv;charset=utf-8','﻿'+rows.join('\r\n'));
}
function exportJSON(){
  var out={pais:M.pais,trimestre:qLbl(UI.q),dias:[]};
  qDias(UI.q).forEach(function(d){var o={fecha:d,estados:{}};M.P.forEach(function(p){o.estados[p.codigo]=status(d,p);});out.dias.push(o);});
  descargar('vacaciones_'+M.pais+'_'+UI.q.y+'_Q'+UI.q.q+'.json','application/json',JSON.stringify(out,null,2));
}

/* ============ EVENTOS (delegación) ============ */
function irQ(k){UI.q=qDeKey(k);UI.mes='all';renderTodo();}
async function accion(a,el){
  if(a==='vista'){UI.vista=el.getAttribute('data-v');renderTodo();}
  else if(a==='mes'){UI.mes=el.getAttribute('data-m');renderTodo();}
  else if(a==='pers'){var p=el.getAttribute('data-p');UI.pers=(UI.pers===p)?'all':p;renderTodo();}
  else if(a==='dia'){UI.modal={t:'dia',d:el.getAttribute('data-d')};UI.editar=false;renderModal();}
  else if(a==='editar'){if(EDIT){UI.editar=!UI.editar;renderModal();}}
  else if(a==='cerrar'){cerrar();}
  else if(a==='qprev'){irQ(qKey(UI.q)-1);}
  else if(a==='qnext'){irQ(qKey(UI.q)+1);}
  else if(a==='qhoy'){irQ(qKey(qDe(hoyISO())));}
  else if(a==='qir'){UI.vista='cal';irQ(+el.getAttribute('data-k'));}
  else if(a==='reload'){await recargar();}
  else if(a==='csv'){exportCSV();}
  else if(a==='json'){exportJSON();}
  else if(a==='print'){window.print();}
  else if(a==='m-bulk'){UI.modal={t:'bulk'};renderModal();}
  else if(a==='m-equipo'){UI.modal={t:'equipo'};renderModal();}
  else if(a==='guardar-dia'){await guardarDia();}
  else if(a==='bulk-rango'){await bulkRango();}
  else if(a==='bulk-csv'){await bulkCsv();}
  else if(a==='cfg-save'){await cfgSave();}
  else if(a==='per-save'){await perSave(el);}
  else if(a==='per-baja'){await perBaja(el);}
  else if(a==='hor-add'){await horAdd(el);}
  else if(a==='hor-del'){await horDel(el);}
  else if(a==='per-add'){await perAdd();}
  else if(a==='rev'){await revertir(el.getAttribute('data-id'));}
}
document.addEventListener('click',function(ev){
  var el=ev.target;
  while(el&&el!==document&&!(el.getAttribute&&el.getAttribute('data-action')))el=el.parentNode;
  if(!el||el===document){if(ev.target.id==='ov')cerrar();return;}
  var a=el.getAttribute('data-action');
  if(a==='pais'||a==='qsel')return;
  accion(a,el).catch(function(e){toast(msgErr(e),true);});
});
document.addEventListener('change',function(ev){
  var el=ev.target,a=el&&el.getAttribute&&el.getAttribute('data-action');
  if(el&&el.classList&&el.classList.contains('e-est')){var lv=el.closest('.erow').querySelector('.lv');if(lv)lv.classList.toggle('hid',el.value!=='V');return;}
  if(a==='qsel'){irQ(+el.value);}
  else if(a==='pais'){
    try{sessionStorage.setItem('pdc_vac_pais',el.value);}catch(e){}
    UI.pers='all';UI.bit=null;
    cargar(el.value).then(function(){renderTodo();});
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')cerrar();});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&M.pais&&!UI.modal)recargar(true);});
setInterval(function(){if(!document.hidden&&M.pais&&!UI.modal)recargar(true);},300000);

/* ============ ARRANQUE ============ */
$('usr').textContent=(S.nombre?S.nombre.split(' ').slice(0,2).join(' ')+' · ':'')+(ROL_LBL[S.rol]||S.rol)+(EDIT?'':' · solo lectura');
if(!EDIT){var bs=document.querySelectorAll('[data-admin]');for(var bi=0;bi<bs.length;bi++)bs[bi].style.display='none';}
(async function(){
  if(!window.supabase||!window.supabase.createClient){M.error='No se pudo cargar el componente de datos. Recargue la página.';renderTodo();return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

  var pais=(pi&&S.paises.indexOf(pi)>=0)?pi:(S.paises.indexOf(S.pais)>=0?S.pais:S.paises[0]);
  M.pais=pais;
  await cargar(pais);
  if(!M.cfg)M.cfg={oper_ini:360,oper_fin:1440,sab_auto:false};
  renderTodo();
})();
})();
